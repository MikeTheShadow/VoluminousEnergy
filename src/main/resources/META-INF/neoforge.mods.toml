modLoader = "javafml" #mandatory
loaderVersion = "${loader_version_range}" #mandatory
license = "GPLv3"
issueTrackerURL = "https://github.com/MikeTheShadow/VoluminousEnergy/issues" #optional
[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
# A URL to query for updates for this mod. See the JSON update specification <here>
#updateJSONURL="https://github.com/MikeTheShadow/VoluminousEnergy" #optional
# A URL for the "homepage" for this mod, displayed in the mod UI
displayURL = "https://github.com/MikeTheShadow/VoluminousEnergy" #optional
# A file name (in the root of the mod JAR) containing a logo for display
#logoFile = "examplemod.png" #optional
# A text field displayed in the mod UI
credits = " " #optional
# A text field displayed in the mod UI
authors="${mod_authors}" #optional
# The description text for the mod (multi line!) (#mandatory)
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type="required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "jei"
type="optional"
versionRange = "${jei_version_range}"
ordering = "NONE"
side = "CLIENT"